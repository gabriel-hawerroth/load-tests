# Perfil de carga. Sobe junto do `prod` (SPRING_PROFILES_ACTIVE=prod,loadtest), então
# tudo que não está aqui é exatamente a configuração de produção — inclusive o pool
# Hikari de 8 conexões, virtual threads, open-in-view=false e os limites de multipart.
#
# Regra deste arquivo: só entra o que seria *errado* manter igual a produção num
# ambiente sem internet e com um único IP martelando a API.

# URLs: o e-mail de ativação nunca é enviado (SES está em buraco negro) e o k6 assina
# o próprio token de ativação, mas ServiceUrls é injetado em beans eager.
finax.urls.website=http://localhost:4200
finax.urls.api=https://localhost:58443

# Cookie Secure continua ligado por padrão porque o teste entra por HTTPS no nginx,
# igual a produção. Só desligue junto com BASE_URL em http:// (o k6 e qualquer
# navegador ignoram cookie Secure fora de TLS).
finax.security.cookie-secure=${LT_COOKIE_SECURE:true}

# Rate limit desligado por padrão: um único IP gerando toda a carga estoura as zonas
# do IpRateLimitFilter em segundos, e aí o teste passa a medir o limitador em vez da
# API. Ligue (LT_RATE_LIMIT=true) só quando o alvo do teste for o próprio limitador.
finax.rate-limit.enabled=${LT_RATE_LIMIT:false}
finax.rate-limit.enforcing=${LT_RATE_LIMIT:false}

# SES está inalcançável: com as 4 tentativas padrão cada cadastro deixaria uma thread
# em backoff exponencial por ~30s, ruído que não existe em produção.
finax.email.retry.max-attempts=${LT_EMAIL_RETRY_ATTEMPTS:1}

# Sem stacktrace no corpo (igual prod) mas com log de app em INFO, para que uma falha
# de carga apareça no `docker compose logs api`.
logging.level.br.finax=INFO
logging.level.org.springframework.web=INFO
