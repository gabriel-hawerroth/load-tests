user  nginx;

# Fixo em 2 e não `auto`: nginx conta os cores do host (16), não os do cpuset (2).
# Com `auto` teríamos 16 workers disputando 2 cores — a VM sobe 2.
worker_processes  2;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $upstream_response_time separa o tempo da JVM do tempo total: quando os dois
    # divergem, a fila está no nginx (ou na rede), não na aplicação.
    log_format  finax  '$remote_addr $status $request_method $uri '
                       'rt=$request_time urt=$upstream_response_time '
                       'bytes=$body_bytes_sent';

    access_log  /var/log/nginx/access.log finax buffer=64k flush=5s;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip  on;
    gzip_types application/json;
    gzip_min_length 1024;

    # ── Zonas de rate limit (produção) ───────────────────────────────────────
    # Declaradas sempre; só entram em vigor no site que usa `limit_req`
    # (sites/api-ratelimit.conf). Ver docs/rate-limiting.md §5.1 do backend.
    map $request_method $finax_limit_key {
        OPTIONS  "";
        default  $binary_remote_addr;
    }

    limit_req_zone  $finax_limit_key zone=finax_geral:10m rate=10r/s;
    limit_req_zone  $finax_limit_key zone=finax_auth:10m  rate=1r/s;
    limit_conn_zone $finax_limit_key zone=finax_conn:10m;

    limit_req_status  429;
    limit_conn_status 429;

    upstream apifinax {
        server api:8080;
        # Sem `keepalive`: produção também não tem (o snippet da VM só define
        # proxy_set_header + proxy_intercept_errors). Ligar aqui esconderia o custo
        # real de abrir conexão nova para a JVM a cada requisição.
    }

    include /etc/nginx/conf.d/*.conf;
}
