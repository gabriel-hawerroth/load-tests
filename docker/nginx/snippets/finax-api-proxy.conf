# Espelho de /etc/nginx/snippets/finax-api-proxy.conf da VM.
# `location` não herda `location`: sem incluir isto nos dois blocos, /auth e /login
# respondem 404 estático.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Explícito, apesar de ser o padrão: com `on`, o `error_page 429` sequestraria o 429
# da própria aplicação e trocaria o Retry-After calculado pelo filtro por um fixo.
proxy_intercept_errors off;

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;
