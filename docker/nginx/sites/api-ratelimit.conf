# Site com os limites de produção ligados (docs/rate-limiting.md §5.1 do backend).
# Use com NGINX_SITE=api-ratelimit.conf e, normalmente, LT_RATE_LIMIT=true — o alvo
# aqui é a camada de defesa, não a capacidade da API.
#
# Lembre que 10r/s (burst 20) e 1r/s (burst 10) são por IP: com o k6 num container só,
# o teste inteiro cabe numa única chave e satura em segundos. É o comportamento
# esperado, não um defeito do teste.

server {
    listen 80;
    listen 443 ssl;
    http2 on;

    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size  5m;
    client_body_timeout   15s;
    client_header_timeout 10s;
    send_timeout          20s;

    error_page 429 = @finax_rate_limited;

    location @finax_rate_limited {
        add_header Access-Control-Allow-Origin      "https://appfinax.com.br" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Retry-After                      "1" always;
        default_type application/json;
        return 429 '{"errorDescription":"Muitas tentativas. Tente novamente em instantes.","code":"RATE_LIMITED"}';
    }

    location / {
        include /etc/nginx/snippets/finax-api-proxy.conf;
        limit_req  zone=finax_geral burst=20 nodelay;
        limit_conn finax_conn 20;

        proxy_pass http://apifinax;
    }

    location ~ ^/(auth|login)/ {
        include /etc/nginx/snippets/finax-api-proxy.conf;
        limit_req  zone=finax_auth burst=10 nodelay;
        limit_conn finax_conn 20;

        proxy_pass http://apifinax;
    }
}
