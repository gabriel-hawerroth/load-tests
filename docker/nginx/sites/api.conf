# Site padrão do ambiente de carga: mesma configuração de produção, SEM as
# diretivas `limit_req`/`limit_conn`. Todo o tráfego vem de um IP só, então as
# zonas por IP transformariam o teste numa medição do limitador.
# Para exercitar o limitador, use NGINX_SITE=api-ratelimit.conf.

server {
    listen 80;
    listen 443 ssl;
    http2 on;

    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size  5m;    # 4MB do multipart + overhead
    client_body_timeout   15s;
    client_header_timeout 10s;
    send_timeout          20s;

    location / {
        include /etc/nginx/snippets/finax-api-proxy.conf;
        proxy_pass http://apifinax;
    }

    location ~ ^/(auth|login)/ {
        include /etc/nginx/snippets/finax-api-proxy.conf;
        proxy_pass http://apifinax;
    }
}
